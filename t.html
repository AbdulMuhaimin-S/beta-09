<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZOOM-CLONE --- NIRUPAM TECH</title>
    <!-- Google Fonts for professional typography -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Jitsi External API -->
    <script src="https://meet.jit.si/external_api.js"></script>

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --panel-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --primary-accent: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            --primary-hover: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 2rem;
        }

        /* Container Card wrapping everything together beautifully */
        .workspace-card {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 700px;
            width: 100%;
        }

        .header-title {
            text-align: center;
        }

        .header-title h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-title p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Custom design matching your specific #start button ID */
        #start {
            background: var(--primary-accent);
            color: white;
            border: none;
            padding: 1rem 2.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        #start:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4);
        }

        #start:active {
            transform: translateY(0);
        }

        /* Clean positioning frame for the Jitsi box container */
        .video-viewport {
            background: #090d16;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        /* Enforcing your precise 600x600 structural sizes natively */
        #jitsi-container {
            width: 600px !important;
            height: 600px !important;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Sleek styling for the meeting ended message layout */
        .ended-banner {
            text-align: center;
            animation: fadeIn 0.4s ease-out;
        }

        .ended-banner h2 {
            color: #ef4444;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .ended-banner p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="workspace-card">
        <div class="header-title">
            <h1>NIRUPAM TECH</h1>
            <p>ZOOM-CLONE MEETING MANAGER</p>
        </div>

        <!-- YOUR EXACT ORIGINAL BUTTON CONTAINER LAYOUT -->
        <button id="start" type="start">Create Meeting</button>
        
        <!-- YOUR EXACT ORIGINAL CONTAINER -->
        <div class="video-viewport">
            <div id="jitsi-container"></div>
        </div>
    </div>

    <script>
        var button = document.querySelector('#start');
        var container = document.querySelector('#jitsi-container');
        var api = null;

        button.addEventListener('click', () => {
            var possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            var stringLength = 30;
            
            function pickRandom () {
                return possible[Math.floor(Math.random() * possible.length)];
            }
            var randomString = Array.apply(null,Array(stringLength)).map (pickRandom).join('');

            // Reset container contents cleanly
            container.innerHTML = "";

            var domain = "meet.jit.si";
            var options = {
                "roomName": randomString,
                "parentNode": container,
                "width": 600,
                "height": 600,
                "configOverwrite": {
                    "recommendedAppsEnabled": false,
                    // EXTRA LAYER: Stops Jitsi calling out to ad/promo analytics networks
                    "disableThirdPartyRequests": true
                }
            };
            
            api = new JitsiMeetExternalAPI(domain, options);

            // ULTIMATE WORKAROUND: Forcefully tear down the frame code before the ad script can execute
            api.addEventListener('videoConferenceLeft', () => {
                cleanupMeeting();
            });

            api.addEventListener('readyToClose', () => {
                cleanupMeeting();
            });

            function cleanupMeeting() {
                if (api) {
                    api.dispose();
                    api = null;
                }
                // Wipe the internal structure instantly to clear trapped ad redirects
                container.innerHTML = `
                    <div class="ended-banner">
                        <h2>Meeting Ended</h2>
                        <p>You have successfully disconnected from the secure channel.</p>
                    </div>
                `;
            }
         });
    </script>
</body>
</html>
